<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Puede emerger algo nuevo de la interacción entre un humano y una IA?</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#fff;--text:#24292f;--muted:#57606a;--border:#d0d7de;--link:#0969da;--code:#f6f8fa}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:48px 32px 64px}.markdown h1{font-size:2em;line-height:1.25;border-bottom:1px solid var(--border);padding-bottom:.3em;margin:0 0 24px}.markdown h2{font-size:1.5em;line-height:1.3;border-bottom:1px solid var(--border);padding-bottom:.25em;margin:40px 0 16px}.markdown h3{font-size:1.25em;margin:32px 0 12px}.markdown p{margin:16px 0}.markdown a{color:var(--link);text-decoration:none}.markdown a:hover{text-decoration:underline}.markdown ul,.markdown ol{padding-left:2em}.markdown li{margin:6px 0}.markdown blockquote{margin:16px 0;padding:0 1em;color:var(--muted);border-left:4px solid var(--border)}.markdown code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);padding:.15em .3em;border-radius:4px}.markdown pre{background:var(--code);padding:16px;overflow:auto;border-radius:6px}.markdown hr{border:0;border-top:1px solid var(--border);margin:32px 0}.markdown img{max-width:100%}.status{text-align:center;color:var(--muted);padding:48px 0}@media(max-width:700px){main{padding:28px 18px 48px}.markdown h1{font-size:1.7em}.markdown h2{font-size:1.35em}}
</style>
</head>
<body>
<main><article id="content" class="markdown"><div class="status">Cargando…</div></article></main>
<script>
(function(){
  const rootPath = window.location.pathname.endsWith('/index.html');
  const source = rootPath ? 'corpus.html' : 'README.md';
  if(rootPath){
    fetch(source).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la interfaz del corpus');return r.text()})
      .then(html=>{document.open();document.write(html);document.close()})
      .catch(e=>{document.getElementById('content').innerHTML='<div class="status">No se pudo cargar la interfaz del corpus.</div>';console.error(e)});
    return;
  }
  fetch(source).then(r=>{if(!r.ok)throw new Error('No se pudo cargar README.md');return r.text()})
    .then(md=>{document.getElementById('content').innerHTML=marked.parse(md)})
    .catch(e=>{document.getElementById('content').innerHTML='<div class="status">No se pudo cargar README.md.</div>';console.error(e)});
})();
</script>
</body>
</html>
