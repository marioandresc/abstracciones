<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Puede emerger algo nuevo de la interacción entre un humano y una IA?</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--link:#58a6ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6}
main{width:min(1012px,calc(100% - 40px));margin:0 auto;padding:48px 0 80px}#markdown-content{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:40px 48px}
#markdown-content h1,#markdown-content h2,#markdown-content h3,#markdown-content h4,#markdown-content h5,#markdown-content h6{color:var(--text);line-height:1.25;margin-top:24px;margin-bottom:16px;font-weight:600}
#markdown-content h1{font-size:2em;padding-bottom:.3em;border-bottom:1px solid var(--border)}#markdown-content h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border)}#markdown-content h3{font-size:1.25em}
#markdown-content p{margin:0 0 16px}#markdown-content a{color:var(--link);text-decoration:none}#markdown-content a:hover{text-decoration:underline}
#markdown-content ul,#markdown-content ol{padding-left:2em;margin:0 0 16px}#markdown-content li{margin:4px 0}
#markdown-content blockquote{margin:0 0 16px;padding:0 1em;color:var(--muted);border-left:.25em solid var(--border)}
#markdown-content code{padding:.2em .4em;font-size:85%;background:rgba(110,118,129,.4);border-radius:6px}#markdown-content pre{padding:16px;overflow:auto;font-size:85%;line-height:1.45;background:#0d1117;border-radius:6px}#markdown-content pre code{padding:0;background:transparent}
#markdown-content img{max-width:100%;height:auto}#markdown-content hr{height:.25em;margin:24px 0;background:var(--border);border:0}
#markdown-content table{border-spacing:0;border-collapse:collapse;width:100%;margin-bottom:16px}#markdown-content th,#markdown-content td{padding:6px 13px;border:1px solid var(--border)}#markdown-content th{font-weight:600;background:rgba(110,118,129,.15)}
#loading,#error{text-align:center;padding:80px 20px;color:var(--muted)}#error{color:#ff7b72;display:none}footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}@media(max-width:700px){main{width:min(100% - 20px,1012px);padding-top:20px}#markdown-content{padding:24px 20px}}
</style>
</head>
<body>
<main>
<div id="loading">Cargando README.md…</div>
<div id="error">No se pudo cargar README.md.</div>
<article id="markdown-content" hidden></article>
<footer>Fuente: README.md · marioandresc/abstracciones</footer>
</main>
<script>
(async function(){
 const content=document.getElementById('markdown-content'),loading=document.getElementById('loading'),error=document.getElementById('error');
 try{
  const response=await fetch('./README.md',{cache:'no-cache'}); if(!response.ok) throw new Error('HTTP '+response.status);
  const markdown=await response.text(); marked.setOptions({gfm:true,breaks:true}); content.innerHTML=marked.parse(markdown);
  content.querySelectorAll('a[href]').forEach(link=>{const href=link.getAttribute('href');if(!href||/^(https?:|mailto:|#|\/\/)/i.test(href))return;link.setAttribute('href','./'+href.replace(/^\.\//,''));});
  loading.remove();content.hidden=false;
 }catch(e){console.error(e);loading.remove();error.style.display='block';}
})();
</script>
</body>
</html>
